[package]
name = "bashfuldb-protocol"
description = "Wire protocol (RESP-like) parser, TCP/TLS server for BashfulDB"
version.workspace = true
edition.workspace = true

[features]
default = ["tls"]
tls = [
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rcgen",
    "dep:rustls-pemfile",
]

[dependencies]
async-trait = { workspace = true }
bashfuldb-auth = { path = "../bashfuldb-auth" }
bashfuldb-document = { path = "../bashfuldb-document" }
bytes = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# TLS support (optional)
rustls       = { version = "0.23", optional = true, default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26", optional = true }
rcgen        = { version = "0.13", optional = true }
rustls-pemfile = { version = "2",  optional = true }
